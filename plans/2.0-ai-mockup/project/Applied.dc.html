<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시작한 뒤 홈</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B5CFF}a:hover{color:#5443e6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #191f28">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 24px 24px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0">
<span style="padding: 3px 8px; border-radius: 6px; background: rgba(107, 92, 255, 0.12); color: #5443e6; font-size: 12px; font-weight: 700; line-height: 16px">AI 초안</span>
<h1 style="margin: 0; font-size: 22px; line-height: 1.36; font-weight: 700; color: #191f28">8구단 드래프트 1순위</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.45; color: #4e5968">11월 2일 · 세부 목표를 눌러 실천을 체크해요</p>
</div>
<button type="button" style="flex-shrink: 0; height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: #f2f4f6; color: #333d4b; font-family: inherit; font-size: 15px; font-weight: 600">편집</button>
</div>
<div style="padding: 0 20px">
<div role="group" aria-label="핵심 목표와 세부 목표" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="9">
<sc-if value="{{cell.isGoal}}" hint-placeholder-val="{{ false }}">
<button type="button" style="aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 6px; border: 0; border-radius: 14px; background: #6B5CFF; color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 700; line-height: 1.3; word-break: keep-all; box-sizing: border-box">{{cell.text}}</button>
</sc-if>
<sc-if value="{{cell.isSub}}" hint-placeholder-val="{{ true }}">
<button type="button" style="aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 6px; border: 0; border-radius: 14px; background: rgba(107, 92, 255, 0.14); color: #191f28; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.3; word-break: keep-all; box-sizing: border-box"><span>{{cell.text}}</span><span style="margin-top: 4px; font-size: 11px; font-weight: 500; color: #4e5968">오늘 0/8</span></button>
</sc-if>
</sc-for>
</div>
</div>
<div style="padding: 20px 20px 0">
<div style="display: flex; justify-content: space-between; margin-bottom: 8px">
<span style="font-size: 13px; color: #6b7684">오늘 실천</span>
<span style="font-size: 13px; font-weight: 600; color: #333d4b">0 / 64</span>
</div>
<div style="height: 6px; border-radius: 3px; background: #f2f4f6"></div>
</div>
<div style="display: flex; gap: 8px; padding: 24px 20px 8px">
<button type="button" style="flex: 1; height: 56px; border: 0; border-radius: 16px; background: #6B5CFF; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600">기록 보기</button>
<button type="button" style="flex: 1; height: 56px; border: 0; border-radius: 16px; background: #f2f4f6; color: #333d4b; font-family: inherit; font-size: 17px; font-weight: 600">전체 보기</button>
</div>
<div style="padding-top: 4px">
<button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 14px 24px; border: 0; background: transparent; font-family: inherit; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 600; color: #333d4b">매일 저녁 알림 받기</span>
<span style="font-size: 15px; color: #6b7684">저녁 8시에 오늘 실천을 체크하라고 알려요</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" style="stroke: #b0b8c1; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none"></path></svg>
</button>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 16px 24px; border: 0; background: transparent; font-family: inherit; text-align: left">
<span style="font-size: 17px; font-weight: 600; color: #333d4b">설정</span>
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" style="stroke: #b0b8c1; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none"></path></svg>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const subs = ['체력 강화', '제구력', '구위', '멘탈', '구속 향상', '변화구', '몸 관리', '인성과 태도'];
    const ring = [0, 1, 2, 3, 5, 6, 7, 8];
    const cells = [];
    for (let c = 0; c < 9; c += 1) {
      if (c === 4) cells.push({ text: '8구단 드래프트 1순위', isGoal: true, isSub: false });
      else cells.push({ text: subs[ring.indexOf(c)], isGoal: false, isSub: true });
    }
    return { cells: cells };
  }
}
</script>
</body>
</html>
