<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>지난주 리포트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E3DFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; word-break: keep-all; box-sizing: border-box; position: relative; overflow: hidden; background: #3D31B8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column">
<div aria-label="5장 중 1장" style="margin: 14px 16px 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
<span style="height: 3px; border-radius: 2px; background: #FFFFFF"></span>
<span style="height: 3px; border-radius: 2px; background: rgba(255,255,255,0.35)"></span>
<span style="height: 3px; border-radius: 2px; background: rgba(255,255,255,0.35)"></span>
<span style="height: 3px; border-radius: 2px; background: rgba(255,255,255,0.35)"></span>
<span style="height: 3px; border-radius: 2px; background: rgba(255,255,255,0.35)"></span>
</div>
<div style="padding: 8px 8px 0 24px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.85)">지난주 리포트 · 10월 12일 ~ 18일</span>
<a href="Main.dc.html" aria-label="리포트 닫기" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div style="padding: 48px 28px 0">
<p style="margin: 0; font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.85)">지난주에</p>
<p style="margin: 6px 0 0; font-size: 52px; line-height: 60px; font-weight: 700; letter-spacing: -1.5px">도장 38개</p>
<p style="margin: 6px 0 0; font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.85)">를 찍었어요</p>
</div>
<div role="img" aria-label="월요일부터 일요일까지 7일 모두 도장" style="margin: 36px 28px 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; justify-items: center">
<sc-for list="{{week}}" as="day" hint-placeholder-count="7">
<span style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid #FFFFFF; box-shadow: inset 0 0 0 2px #3D31B8, inset 0 0 0 3.5px #FFFFFF; transform: rotate({{day.turn}}); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{day.count}}</span><span style="font-size: 12px; color: rgba(255,255,255,0.75)">{{day.label}}</span></span>
</sc-for>
</div>
<div style="margin: 36px 28px 0; padding: 18px; border-radius: 18px; background: rgba(255,255,255,0.12); display: flex; flex-direction: column; gap: 10px; font-size: 16px">
<p style="margin: 0; display: flex; justify-content: space-between"><span style="color: rgba(255,255,255,0.8)">실천한 날</span><b>7일 모두</b></p>
<p style="margin: 0; display: flex; justify-content: space-between"><span style="color: rgba(255,255,255,0.8)">그 전 주보다</span><b>17개 더</b></p>
<p style="margin: 0; display: flex; justify-content: space-between"><span style="color: rgba(255,255,255,0.8)">손댄 세부 목표</span><b>8개 모두</b></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const counts = [6, 5, 8, 4, 7, 3, 5];
    const labels = ['월', '화', '수', '목', '금', '토', '일'];
    const turns = ['-12deg', '-4deg', '8deg', '-9deg', '4deg', '-14deg', '6deg'];
    return { week: counts.map((count, i) => ({ key: i, count: `${count}`, label: labels[i], turn: turns[i] })) };
  }
}
</script>
</body>
</html>
