<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>달력 대시보드 1년</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B4ED9}a:hover{color:#4A3FC0}
</style>
</helmet>
<div style="width: 390px; height: 844px; word-break: keep-all; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #191F28; display: flex; flex-direction: column">
<header style="flex-shrink: 0; padding: 14px 24px 4px">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 24px; font-size: 13px; font-weight: 600; color: #6B7684; text-decoration: none">기록</a>
<h1 style="margin: 0; font-size: 24px; line-height: 34px; font-weight: 700">달력</h1>
</header>
<div role="radiogroup" aria-label="기간" style="flex-shrink: 0; margin: 12px 24px 4px; align-self: flex-start; display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: #F2F4F6">
<button type="button" role="radio" aria-checked="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #4E5968; cursor: pointer">주</button>
<button type="button" role="radio" aria-checked="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #4E5968; cursor: pointer">월</button>
<button type="button" role="radio" aria-checked="true" style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #191F28; box-shadow: 0 1px 2px rgba(0,0,0,0.08); cursor: pointer">년</button>
</div>
<div style="padding: 8px 24px 4px">
<p style="margin: 0; font-size: 14px; color: #6B7684">2026년 · 5월 2일 첫 도장부터</p>
<p style="margin: 4px 0 0; font-size: 22px; line-height: 32px; font-weight: 700">142일 동안 도장 403개를 찍었어요</p>
</div>
<div style="margin: 12px 20px 0; padding: 16px 12px 12px; border-radius: 16px; border: 1px solid #E5E8EB">
<div style="display: grid; grid-template-columns: 22px 1fr; column-gap: 4px">
<span></span>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(27, 10px); column-gap: 2px; font-size: 10px; color: #6B7684; height: 14px">
<span style="grid-column: 2 / span 4">5월</span>
<span style="grid-column: 6 / span 4">6월</span>
<span style="grid-column: 11 / span 4">7월</span>
<span style="grid-column: 15 / span 4">8월</span>
<span style="grid-column: 20 / span 4">9월</span>
<span style="grid-column: 24 / span 4">10월</span>
</div>
<div aria-hidden="true" style="display: grid; grid-template-rows: repeat(7, 10px); row-gap: 2px; font-size: 9px; line-height: 10px; color: #6B7684">
<span>월</span><span></span><span>수</span><span></span><span>금</span><span></span><span>일</span>
</div>
<div role="img" aria-label="5월부터 10월까지 날마다 찍은 도장 수를 색 진하기로 보여 주는 잔디" style="display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 10px); grid-auto-columns: 10px; gap: 2px">
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="189">
<span style="width: 10px; height: 10px; border-radius: 2px; background: {{cell.color}}"></span>
</sc-for>
</div>
</div>
<div style="margin-top: 12px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 11px; color: #6B7684">
<span style="margin-right: 2px">적음</span>
<span style="width: 10px; height: 10px; border-radius: 2px; background: #EEF0F3"></span>
<span style="width: 10px; height: 10px; border-radius: 2px; background: #DCD8FF"></span>
<span style="width: 10px; height: 10px; border-radius: 2px; background: #B8B1FF"></span>
<span style="width: 10px; height: 10px; border-radius: 2px; background: #8E83FF"></span>
<span style="width: 10px; height: 10px; border-radius: 2px; background: #5B4ED9"></span>
<span style="margin-left: 2px">많음</span>
</div>
</div>
<div style="margin: 16px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="padding: 12px; border-radius: 14px; background: #F9FAFB"><p style="margin: 0; font-size: 12px; color: #6B7684">지금 연속</p><p style="margin: 2px 0 0; font-size: 18px; font-weight: 700; color: #5B4ED9">12일</p></div>
<div style="padding: 12px; border-radius: 14px; background: #F9FAFB"><p style="margin: 0; font-size: 12px; color: #6B7684">최장 연속</p><p style="margin: 2px 0 0; font-size: 18px; font-weight: 700">23일</p></div>
<div style="padding: 12px; border-radius: 14px; background: #F9FAFB"><p style="margin: 0; font-size: 12px; color: #6B7684">가장 잘한 달</p><p style="margin: 2px 0 0; font-size: 18px; font-weight: 700">9월</p></div>
</div>
<h2 style="margin: 20px 24px 6px; font-size: 17px; font-weight: 700; color: #333D4B">달마다 찍은 도장</h2>
<ul style="margin: 0; padding: 0 24px; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
<li style="display: grid; grid-template-columns: 40px 1fr 44px; align-items: center; gap: 8px"><span>10월</span><span style="height: 8px; border-radius: 4px; background: #F2F4F6"><span style="display: block; width: 95%; height: 8px; border-radius: 4px; background: #8E83FF"></span></span><span style="text-align: right; color: #4E5968">84개</span></li>
<li style="display: grid; grid-template-columns: 40px 1fr 44px; align-items: center; gap: 8px"><span>9월</span><span style="height: 8px; border-radius: 4px; background: #F2F4F6"><span style="display: block; width: 100%; height: 8px; border-radius: 4px; background: #5B4ED9"></span></span><span style="text-align: right; color: #4E5968">88개</span></li>
<li style="display: grid; grid-template-columns: 40px 1fr 44px; align-items: center; gap: 8px"><span>8월</span><span style="height: 8px; border-radius: 4px; background: #F2F4F6"><span style="display: block; width: 83%; height: 8px; border-radius: 4px; background: #8E83FF"></span></span><span style="text-align: right; color: #4E5968">73개</span></li>
<li style="display: grid; grid-template-columns: 40px 1fr 44px; align-items: center; gap: 8px"><span>7월</span><span style="height: 8px; border-radius: 4px; background: #F2F4F6"><span style="display: block; width: 63%; height: 8px; border-radius: 4px; background: #B8B1FF"></span></span><span style="text-align: right; color: #4E5968">55개</span></li>
</ul>
<aside aria-label="광고" style="margin: 20px 20px 0; height: 56px; flex-shrink: 0; border-radius: 12px; background: #F2F4F6; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6B7684">배너 광고</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // 2026-04-27(월)부터 27주. 10월 1~21일은 A1 달력과 같은 숫자예요
    const oct = [3, 5, 0, 2, 6, 4, 0, 5, 0, 2, 4, 6, 5, 8, 4, 7, 3, 5, 6, 5, 4];
    const day = 86400000;
    const start = Date.UTC(2026, 3, 27);
    const first = Date.UTC(2026, 4, 2);
    const today = Date.UTC(2026, 9, 21);
    let seed = 11;
    const rand = () => {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };
    const cells = [];
    for (let i = 0; i < 27 * 7; i += 1) {
      const t = start + i * day;
      const d = new Date(t);
      const month = d.getUTCMonth();
      let count;
      if (t > today) count = -1;
      else if (t < first) count = 0;
      else if (month === 9) count = oct[d.getUTCDate() - 1];
      else {
        const zero = month <= 5 ? 0.45 : month <= 7 ? 0.3 : 0.15;
        count = rand() < zero ? 0 : 1 + Math.floor(rand() * (month >= 7 ? 8 : 5));
      }
      const color = count < 0 ? 'transparent' : count === 0 ? '#EEF0F3' : count <= 2 ? '#DCD8FF' : count <= 4 ? '#B8B1FF' : count <= 6 ? '#8E83FF' : '#5B4ED9';
      cells.push({ key: i, color });
    }
    return { cells };
  }
}
</script>
</body>
</html>
