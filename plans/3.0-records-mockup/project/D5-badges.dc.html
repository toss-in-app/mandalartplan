<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배지 대시보드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B4ED9}a:hover{color:#4A3FC0}
</style>
</helmet>
<div style="width: 390px; height: 844px; word-break: keep-all; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #191F28; display: flex; flex-direction: column">
<header style="flex-shrink: 0; padding: 14px 24px 10px">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 24px; font-size: 13px; font-weight: 600; color: #6B7684; text-decoration: none">기록</a>
<h1 style="margin: 0; font-size: 24px; line-height: 34px; font-weight: 700">배지</h1>
</header>
<div style="padding: 8px 24px 0">
<p style="margin: 0; font-size: 22px; line-height: 32px; font-weight: 700">배지 6개를 모았어요</p>
<p style="margin: 2px 0 0; font-size: 14px; color: #4E5968">12개 중 · 가장 최근 '도장 300개' 9월 17일</p>
</div>
<div style="margin: 18px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 8px">
<sc-for list="{{badges}}" as="badge" hint-placeholder-count="12">
<span style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<span role="img" aria-label="{{badge.label}}" style="width: 68px; height: 68px; box-sizing: border-box; border-radius: 50%; border: {{badge.ring}}; box-shadow: {{badge.inner}}; background: {{badge.bg}}; transform: rotate(-10deg); display: flex; align-items: center; justify-content: center; font-size: {{badge.size}}; font-weight: 700; color: {{badge.ink}}">{{badge.mark}}</span>
<span style="font-size: 13px; font-weight: 600; color: {{badge.titleColor}}">{{badge.title}}</span>
<span style="font-size: 11px; color: #6B7684">{{badge.sub}}</span>
</span>
</sc-for>
</div>
<aside aria-label="광고" style="margin: 20px 20px 0; height: 56px; flex-shrink: 0; border-radius: 12px; background: #F2F4F6; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6B7684">배너 광고</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['첫', '첫 도장', '5월 2일', true],
      ['7', '7일 연속', '6월 9일', true],
      ['14', '14일 연속', '2일 남았어요', false],
      ['30', '30일 연속', '최고 23일', false],
      ['100', '도장 100개', '6월 28일', true],
      ['300', '도장 300개', '9월 17일', true],
      ['500', '도장 500개', '97개 남았어요', false],
      ['8', '하루에 여덟 가지', '최고 7가지', false],
      ['30번', '한 실천 30번', '밤 12시 전에 자기', true],
      ['20일', '한 달 20일', '9월 24일 실천', true],
      ['64', '64칸 모두 한 번씩', '16칸 남았어요', false],
      ['고루', '고루 한 날 10번', '7번 했어요', false],
    ];
    const badges = list.map(([mark, title, sub, earned], i) => ({
      key: i,
      mark,
      title,
      sub,
      size: mark.length >= 3 ? '17px' : '22px',
      ring: earned ? '3px solid #5B4ED9' : '2px dashed #D1D6DB',
      inner: earned ? 'inset 0 0 0 3px #FFFFFF, inset 0 0 0 5px #5B4ED9' : 'none',
      bg: earned ? '#F3F1FF' : '#FFFFFF',
      ink: earned ? '#5B4ED9' : '#B0B8C1',
      titleColor: earned ? '#191F28' : '#6B7684',
      label: `${title} ${earned ? '받음' : '아직'}, ${sub}`,
    }));
    return { badges };
  }
}
</script>
</body>
</html>
