<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>만다라트 대시보드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B4ED9}a:hover{color:#4A3FC0}
</style>
</helmet>
<div style="width: 390px; height: 844px; word-break: keep-all; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #191F28; display: flex; flex-direction: column">
<header style="flex-shrink: 0; padding: 14px 24px 4px">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 24px; font-size: 13px; font-weight: 600; color: #6B7684; text-decoration: none">기록</a>
<h1 style="margin: 0; font-size: 24px; line-height: 34px; font-weight: 700">만다라트</h1>
</header>
<div role="radiogroup" aria-label="기간" style="flex-shrink: 0; margin: 12px 24px 4px; align-self: flex-start; display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: #F2F4F6">
<button type="button" role="radio" aria-checked="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #4E5968; cursor: pointer">주</button>
<button type="button" role="radio" aria-checked="true" style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #191F28; box-shadow: 0 1px 2px rgba(0,0,0,0.08); cursor: pointer">월</button>
<button type="button" role="radio" aria-checked="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #4E5968; cursor: pointer">년</button>
</div>
<div style="padding: 8px 24px 0">
<p style="margin: 0; font-size: 14px; color: #6B7684">2026년 10월 · 도장 84개</p>
<p style="margin: 4px 0 0; font-size: 22px; line-height: 32px; font-weight: 700">이번 달 만다라트</p>
<p style="margin: 2px 0 0; font-size: 14px; color: #4E5968">자주 한 실천일수록 칸이 진해져요</p>
</div>
<div role="img" aria-label="9×9 만다라트에 이번 달 실천 횟수를 색으로 칠한 그림. 가장 진한 칸은 밤 12시 전에 자기 14번" style="margin: 14px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px">
<sc-for list="{{blocks}}" as="block" hint-placeholder-count="9">
<span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 9px; background: {{block.frame}}">
<sc-for list="{{block.cells}}" as="cell" hint-placeholder-count="9">
<span style="height: 34px; border-radius: 5px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 9px; line-height: 11px; font-weight: 700; padding: 0 1px; background: {{cell.bg}}; color: {{cell.fg}}; border: {{cell.border}}">{{cell.text}}</span>
</sc-for>
</span>
</sc-for>
</div>
<div style="margin: 10px 24px 0; display: flex; align-items: center; gap: 4px; font-size: 11px; color: #6B7684">
<span style="margin-right: 2px">0번</span>
<span style="width: 14px; height: 10px; border-radius: 2px; background: #F2F4F6"></span>
<span style="width: 14px; height: 10px; border-radius: 2px; background: #E3DFFF"></span>
<span style="width: 14px; height: 10px; border-radius: 2px; background: #C2BBFF"></span>
<span style="width: 14px; height: 10px; border-radius: 2px; background: #8E83FF"></span>
<span style="width: 14px; height: 10px; border-radius: 2px; background: #5B4ED9"></span>
<span style="margin-left: 2px">10번 이상</span>
</div>
<section style="margin: 14px 20px 0; padding: 14px 16px; border-radius: 16px; background: #F9FAFB; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
<p style="margin: 0; display: flex; justify-content: space-between"><span style="color: #4E5968">가장 진한 칸</span><b>밤 12시 전에 자기 · 14번</b></p>
<p style="margin: 0; display: flex; justify-content: space-between"><span style="color: #4E5968">아직 하얀 칸</span><b>41개</b></p>
</section>
<aside aria-label="광고" style="margin: 14px 20px 0; height: 56px; flex-shrink: 0; border-radius: 12px; background: #F2F4F6; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6B7684">배너 광고</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // 세부 목표 순서: 수면·운동·식사·마음·검진·관계·일과 쉼·습관 — 판의 둘레 자리(0,1,2,3,5,6,7,8)
    const short = ['수면', '운동', '식사', '마음', '검진', '관계', '일과 쉼', '습관'];
    const counts = [
      [14, 3, 0, 0, 2, 0, 0, 0],
      [2, 1, 2, 11, 0, 0, 0, 0],
      [4, 0, 10, 0, 0, 0, 0, 0],
      [9, 2, 0, 0, 0, 1, 0, 0],
      [0, 0, 0, 3, 3, 2, 0, 0],
      [2, 0, 1, 0, 0, 0, 0, 0],
      [3, 0, 0, 2, 2, 0, 0, 0],
      [1, 2, 0, 0, 2, 0, 0, 0],
    ];
    const heat = (n) => (n === 0 ? '#F2F4F6' : n <= 2 ? '#E3DFFF' : n <= 5 ? '#C2BBFF' : n <= 9 ? '#8E83FF' : '#5B4ED9');
    const ringAt = [0, 1, 2, 3, -1, 4, 5, 6, 7];
    const blocks = ringAt.map((s, b) => {
      const cells = ringAt.map((a, c) => {
        if (s === -1) {
          if (a === -1) return { key: c, text: '건강', bg: '#6B5CFF', fg: '#FFFFFF', border: '0' };
          const total = counts[a].reduce((x, y) => x + y, 0);
          return { key: c, text: short[a], bg: heat(Math.round(total / 2)), fg: total >= 12 ? '#FFFFFF' : '#333D4B', border: '0' };
        }
        if (a === -1) return { key: c, text: short[s], bg: '#FFFFFF', fg: '#333D4B', border: '1.5px solid #D1D6DB' };
        const n = counts[s][a];
        return { key: c, text: '', bg: heat(n), fg: '#FFFFFF', border: '0' };
      });
      return { key: b, frame: s === -1 ? '#F3F1FF' : '#FFFFFF', cells };
    });
    return { blocks };
  }
}
</script>
</body>
</html>
