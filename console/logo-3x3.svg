<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- mandalartplan 로고 대안 초안(2026-10-16). 9×9 초안은 48px 에서 흐린 점으로만 보여서, 만다라트의 핵심인 3×3 으로 줄였어요.
       600×600, 배경색 꽉 채움(투명·둥근 모서리 없음), 브랜드 #6B5CFF, 토스 리소스 없음. 칸 120 · 간격 24 · 여백 96 -->
  <rect width="600" height="600" fill="#6B5CFF"/>
  <g fill="#FFFFFF" fill-opacity="0.4">
    <rect x="96" y="96" width="120" height="120" rx="28"/>
    <rect x="240" y="96" width="120" height="120" rx="28"/>
    <rect x="384" y="96" width="120" height="120" rx="28"/>
    <rect x="96" y="240" width="120" height="120" rx="28"/>
    <rect x="384" y="240" width="120" height="120" rx="28"/>
    <rect x="96" y="384" width="120" height="120" rx="28"/>
    <rect x="240" y="384" width="120" height="120" rx="28"/>
    <rect x="384" y="384" width="120" height="120" rx="28"/>
  </g>
  <!-- 가운데 = 핵심 목표 -->
  <rect x="240" y="240" width="120" height="120" rx="28" fill="#FFFFFF"/>
</svg>
